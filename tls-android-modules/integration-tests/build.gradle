plugins { id 'java' }

dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
  // Use built classes.jar artifacts from Android library modules to avoid variant ambiguity
  testImplementation files(
    // Use AGP 8.x 'aar_main_jar' classes.jar as a stable artifact
    "$rootDir/core/build/intermediates/aar_main_jar/release/syncReleaseLibJars/classes.jar",
    "$rootDir/full/build/intermediates/aar_main_jar/release/syncReleaseLibJars/classes.jar",
    "$rootDir/producer-lite/build/intermediates/aar_main_jar/release/syncReleaseLibJars/classes.jar",
    "$rootDir/producer-native/build/intermediates/aar_main_jar/release/syncReleaseLibJars/classes.jar"
  )
  // Runtime deps used by core/full
  testImplementation 'com.squareup.okhttp3:okhttp:3.12.13'
  testImplementation 'com.squareup.okio:okio:1.17.5'
  testImplementation 'com.google.protobuf:protobuf-javalite:3.23.2'
  testImplementation 'com.alibaba:fastjson:1.2.83'
  testImplementation 'com.google.guava:guava:33.5.0-jre'
  testImplementation 'net.jpountz.lz4:lz4:1.3.0'
}

tasks.named('compileTestJava') {
  dependsOn ':core:syncReleaseLibJars', ':full:syncReleaseLibJars', ':producer:syncReleaseLibJars', ':producer-native:syncReleaseLibJars'
}

tasks.named('test') {
  dependsOn ':core:assembleRelease', ':full:assembleRelease', ':producer:assembleRelease', ':producer-native:assembleRelease'
}

test {
  useJUnitPlatform()
  testLogging { events "passed", "skipped", "failed" }
}
