plugins {
  id 'com.android.library'
}

android {
  namespace 'com.volcengine.tls.android.producer'
  compileSdk 34

  defaultConfig {
    minSdk 16
    consumerProguardFiles 'consumer-rules.pro'
  }

  buildTypes {
    release {
      minifyEnabled false
      consumerProguardFiles 'consumer-rules.pro'
    }
    debug {
      minifyEnabled false
      consumerProguardFiles 'consumer-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
}
