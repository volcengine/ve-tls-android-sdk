pluginManagement {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }
}

plugins {
  id 'com.android.application' version '8.4.0' apply false
  id 'com.android.library' version '8.4.0' apply false
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenLocal()
    mavenCentral()
  }
}

include ':core', ':full', ':app', ':app-empty', ':app-no-sdk', ':logger-spi', ':producer-native', ':producer-native-stub', ':integration-tests'
project(':logger-spi').projectDir = new File('logger-spi')
project(':producer-native').projectDir = new File('producer-native')
project(':producer-native-stub').projectDir = new File('producer-native-stub')
project(':integration-tests').projectDir = new File('integration-tests')
