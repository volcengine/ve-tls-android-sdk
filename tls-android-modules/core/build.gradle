plugins {
  id 'com.android.library'
  id 'maven-publish'
  id 'signing'
}

def api16Variant = (findProperty('API16_VARIANT') ?: 'false').toBoolean()
def defaultMinSdk = api16Variant ? 16 : 21

android {
  namespace 'com.volcengine.tls.android.core'
  compileSdk 34
  defaultConfig {
    minSdk ((findProperty('MIN_SDK_OVERRIDE') ?: defaultMinSdk) as int)
    targetSdk 34
    consumerProguardFiles 'consumer-rules.pro'
  }
  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  sourceSets {
    main {
    }
  }
  publishing {
    singleVariant("release") {
      withSourcesJar()
    }
  }
}



dependencies {
  api 'com.squareup.okhttp3:okhttp:3.12.13'
  api 'com.squareup.okio:okio:1.17.5'
  api 'com.google.protobuf:protobuf-javalite:3.23.2'
  if (api16Variant) {
    api 'org.conscrypt:conscrypt-android:2.5.3'
  }
  compileOnly 'net.jpountz.lz4:lz4:1.3.0'
  compileOnly 'com.alibaba:fastjson:1.2.83'
  compileOnly 'org.projectlombok:lombok:1.18.20'
  annotationProcessor 'org.projectlombok:lombok:1.18.20'
  // after migration, core is self-contained; no dependency on :full
  testImplementation 'junit:junit:4.13.2'
}

group = 'io.github.volcengine-tls'
def baseVersion = (findProperty('POM_VERSION') ?: '2.0.4').toString()
def versionSuffix = (findProperty('VERSION_SUFFIX') ?: (api16Variant ? '-api16' : '')).toString()
version = baseVersion + versionSuffix

// Keep the runtime User-Agent version aligned with the published artifact.
tasks.matching { it.name.endsWith('JavaRes') }.configureEach {
  filesMatching('com/volcengine/version') {
    filter { String line -> line.startsWith('version=') ? "version=${project.version}" : line }
  }
}

afterEvaluate {
  publishing {
    publications {
      release(MavenPublication) {
        from components.release
        groupId = project.group
        artifactId = 'tls-android-core'
        version = project.version
        pom {
          name = 'tls-android-core'
          description = 'VOLC Engine TLS Core SDK for Android'
          url = 'https://github.com/volcengine/ve-tls-android-sdk'
          licenses {
            license {
              name = 'The Apache Software License, Version 2.0'
              url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
              distribution = 'repo'
            }
          }
          developers {
            developer {
              id = 'volcproducts'
              name = 'VOLC TLS ANDROID SDK'
            }
          }
          scm {
            url = 'https://github.com/volcengine/ve-tls-android-sdk'
            connection = 'scm:git:https://github.com/volcengine/ve-tls-android-sdk.git'
            developerConnection = 'scm:git:https://github.com/volcengine/ve-tls-android-sdk.git'
          }
        }
      }
    }
    repositories {
      maven {
        name = 'sonatype'
        url = uri('https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/')
        credentials {
          username = findProperty('ossrhUsername') ?: System.getenv('OSSRH_USERNAME')
          password = findProperty('ossrhPassword') ?: System.getenv('OSSRH_PASSWORD')
        }
      }
    }
  }

  signing {
    def key = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
    def pw = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')
    if (key != null && pw != null) {
      useInMemoryPgpKeys(key, pw)
      sign publishing.publications
    } else {
      def gpgKeyName = findProperty('signing.gnupg.keyName') ?: System.getenv('SIGNING_GPG_KEYNAME')
      if (gpgKeyName != null) {
        useGpgCmd()
        sign publishing.publications
      }
    }
  }
}
