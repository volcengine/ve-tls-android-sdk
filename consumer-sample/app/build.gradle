plugins {
  id 'com.android.application'
}

android {
  namespace 'com.volcengine.consumer'
  compileSdk 34

  defaultConfig {
    applicationId 'com.volcengine.consumer'
    minSdk 19
    targetSdk 34
    versionCode 1
    versionName '1.0.0'
    buildConfigField 'String', 'TLS_ENDPOINT', '"https://tls-cn-example.volces.com"'
    buildConfigField 'String', 'TLS_REGION', '"cn-example"'
    buildConfigField 'String', 'TLS_AK', '"AK_EXAMPLE"'
    buildConfigField 'String', 'TLS_SK', '"SK_EXAMPLE"'
    buildConfigField 'String', 'TLS_TOKEN', '""'
    buildConfigField 'String', 'TLS_TOPIC_ID', '"topic-example"'
  }

  buildTypes {
    release {
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    debug {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  buildFeatures {
    buildConfig true
  }

}

dependencies {
  implementation 'io.github.volcengine-tls:tls-android-producer:2.1.1'
  implementation 'net.jpountz.lz4:lz4:1.3.0'
  testImplementation 'junit:junit:4.13.2'
}
