name: Android CI

on:
  push:
    branches: [ main, master, master-2.0, 'fix/**' ]
  pull_request:
    branches: [ main, master, master-2.0 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api21-plus
            gradle_args: '-PAPI16_VARIANT=false'
          - name: api16
            gradle_args: '-PAPI16_VARIANT=true'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Build AARs (${{ matrix.name }})
        working-directory: tls-android-modules
        run: |
          ./gradlew ${{ matrix.gradle_args }} :core:test :core:assembleRelease :full:assembleRelease :producer:assembleRelease --stacktrace --no-daemon

      - name: Run Integration Tests
        working-directory: tls-android-modules
        run: |
          ./gradlew ${{ matrix.gradle_args }} :integration-tests:test --stacktrace --no-daemon
