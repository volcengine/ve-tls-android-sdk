name: Android CI

on:
  push:
    branches: [ master-2.0, sync-main ]
  pull_request:
    branches: [ master-2.0 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned C SDK commit
        id: c_sdk_version
        shell: bash
        run: |
          commit="$(tr -d '\r\n' < tls-android-modules/producer-native/ve-tls-c-sdk.version)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pinned C SDK commit: $commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout C SDK
        uses: actions/checkout@v4
        with:
          repository: volcengine/ve-tls-c-sdk
          ref: ${{ steps.c_sdk_version.outputs.commit }}
          path: ve-tls-c-sdk

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android toolchain
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Build AARs
        working-directory: tls-android-modules
        run: |
          ./gradlew :logger-spi:assemble :producer-native-stub:assembleRelease :producer-native:assembleRelease -PVE_TLS_C_SDK_DIR="$GITHUB_WORKSPACE/ve-tls-c-sdk" --stacktrace

      - name: Run Integration Tests
        working-directory: tls-android-modules
        run: |
          ./gradlew :integration-tests:test -PVE_TLS_C_SDK_DIR="$GITHUB_WORKSPACE/ve-tls-c-sdk" --stacktrace
