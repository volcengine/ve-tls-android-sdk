name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build AARs
        working-directory: tls-android-modules
        run: |
          ./gradlew :core:assembleRelease :full:assembleRelease :producer:assembleRelease --stacktrace

      - name: Run Integration Tests
        working-directory: tls-android-modules
        run: |
          ./gradlew :integration-tests:test --stacktrace

