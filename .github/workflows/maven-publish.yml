name: Maven Central Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish Maven Central
    runs-on: ubuntu-latest
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      PGP_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref }}

      - name: Setup Java and Maven Central credentials
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN

      - name: Resolve release coordinates
        id: release
        run: |
          set -euo pipefail
          published_version="${GITHUB_REF_NAME#v}"
          if [[ "$published_version" == *-api16 ]]; then
            base_version="${published_version%-api16}"
            api16_variant=1
          else
            base_version="$published_version"
            api16_variant=0
          fi
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported Maven version: $base_version" >&2
            exit 1
          fi
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "published_version=$published_version" >> "$GITHUB_OUTPUT"
          echo "api16_variant=$api16_variant" >> "$GITHUB_OUTPUT"
          echo "Publishing $published_version from $GITHUB_SHA"

      - name: Validate publishing secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_TOKEN"
          test -n "$PGP_PASSPHRASE"
          test -n "$GPG_PRIVATE_KEY"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build and test release variant
        working-directory: tls-android-modules
        run: |
          set -euo pipefail
          ./gradlew -PAPI16_VARIANT="${{ steps.release.outputs.api16_variant }}" \
            :core:test \
            :core:assembleRelease \
            :producer:assembleRelease \
            :full:assembleRelease \
            --stacktrace --no-daemon

      - name: Publish to Maven Central
        working-directory: tls-android-modules
        env:
          BASE_VERSION: ${{ steps.release.outputs.base_version }}
          API16_VARIANT: ${{ steps.release.outputs.api16_variant }}
        run: |
          set -euo pipefail
          bash scripts/publish-central-mvn.sh
